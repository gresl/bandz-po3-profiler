# Include inside webhook.grecea.net HTTPS server only.
location ^~ /bandz-hook/ {
    access_log /var/log/nginx/bandz-access.log bandz_safe;
    error_log /dev/null crit;

    # Direct TradingView sender IPs, checked 2026-11-24.
    # Loopback is deliberately permitted for authenticated local testing.
    satisfy all;
    allow 127.0.0.0/8;
    allow 52.89.214.238;
    allow 34.212.75.30;
    allow 54.218.53.128;
    allow 52.32.178.7;
    deny all;

    limit_req zone=bandz_per_ip burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 40k;
    client_body_timeout 2s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_request_buffering on;
    proxy_connect_timeout 1s;
    proxy_send_timeout 2s;
    proxy_read_timeout 2s;
    proxy_next_upstream off;
    proxy_intercept_errors off;
    proxy_pass http://127.0.0.1:8081;
}
